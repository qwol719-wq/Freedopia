<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فريدوبيا</title>

  <!-- رابط الخط من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Tajawal", sans-serif; /* استخدام الخط الجديد */
      background: 
        linear-gradient(rgba(245, 245, 220, 0.8), rgba(245, 245, 220, 0.8)),
        url("https://www2.0zz0.com/2025/09/27/19/676226773.jpeg") no-repeat center center fixed;
      background-size: cover;
      color: #000000; /* النص بالأسود */
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 50px 20px;
    }
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      font-size: 0.9em;
    }
    a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>أهلاً بك في فريدوبيا ✨</h1>
  </header>

  <div class="card">
    <h2>من نحن؟</h2>
    <p>
      مجتمع فكري وثقافي يسعى الى بناء مساحة آمنة وملهمة، لكل من يؤمن
      بالعلم، ويحب الحوار، ويبحث عن الحقيقة والمعرفة
    </p>
  </div>

  <div class="card">
    <h2>روابط</h2>
    <p>
      <a href="https://discord.gg/3rQhhq3Dqs" target="_blank">Discord</a> | 
      <a href="https://x.com/Fareedopia" target="_blank">X</a>
    </p>
  </div>

  <footer>
    <p>© 2025 فريدوبيا - جميع الحقوق محفوظة</p>
  </footer>
</body>
</html>
