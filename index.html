<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موقعي الشخصي</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background: linear-gradient(135deg, #6dd5fa, #2980b9);
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    header {
      padding: 50px 20px;
    }
    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    header p {
      font-size: 1.2em;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      font-size: 0.9em;
    }
    a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>أهلاً بك في موقعي ✨</h1>
    <p>هذا موقعي الأول باستخدام <strong>GitHub Pages</strong></p>
  </header>

  <div class="card">
    <h2>من أنا؟</h2>
    <p>اكتب هنا نبذة قصيرة عن نفسك، شغفك، أو مشروعك.</p>
  </div>

  <div class="card">
    <h2>روابط</h2>
    <p>
      <a href="https://github.com" target="_blank">حساب GitHub</a> | 
      <a href="https://x.com" target="_blank">حساب X</a>
    </p>
  </div>

  <footer>
    <p>© 2025 موقعي الشخصي - جميع الحقوق محفوظة</p>
  </footer>
</body>
</html>
